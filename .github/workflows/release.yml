# CI build: Actions ▸ Build ▸ Run workflow → an (ad hoc signed) DMG as a downloadable artifact.
#
# Releases are NOT made here any more: since 2.5 they're Developer ID signed, notarized and listed in
# the Sparkle appcast, which needs the signing certificate, the notary credentials and the Sparkle
# EdDSA key — all of which live on the release Mac. Run ./release.sh there instead.
name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26          # Apple Silicon runner with Xcode 26 (needed for the Liquid Glass APIs)
    steps:
      - uses: actions/checkout@v4

      - name: Cache embedded Python + wheels, and Sparkle
        uses: actions/cache@v4
        with:
          path: |
            build/python3.13-arm64
            build/sparkle-*
          key: build-arm64-${{ hashFiles('engine/requirements.txt', 'build.sh') }}

      - name: Build disk image
        run: ./build.sh --dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Narrate-dmg
          path: dist/*.dmg
